worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # Only explicitly trusted public hosts may supply account email-link origins.
    map $host $anoni_frontend_origin {
        default "";
        chanonim.web.id https://chanonim.web.id;
    }

    # ponytail: no IP logging anywhere — anonimity hard requirement
    log_format anon '$time_local "$request" $status $bytes_sent';
    access_log /var/log/nginx/anon_access.log anon;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Basic rate limiting per IP (for anonymous users, IP isn't stored)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;

    server {
        listen 8080;
        server_name _;

        # API routes to Express backend
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Anoni-Frontend-Origin $anoni_frontend_origin;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
        }

        # WebSocket upgrade
        location /socket.io/ {
            limit_req zone=ws burst=10 nodelay;
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_read_timeout 86400;
        }

        # Frontend Next.js
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
        }
    }

    # Situs lain di host yang sama
    include /etc/nginx/conf.d/*.conf;
}
