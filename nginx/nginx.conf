worker_processes auto;
error_log /dev/null emerg;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ponytail: no IP logging anywhere — anonimity hard requirement
    log_format anon '$time_local "$request" $status $bytes_sent';
    access_log /dev/stdout anon;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Basic rate limiting per IP (for anonymous users, IP isn't stored)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;

    server {
        listen 80;
        server_name _;

        # API routes to Express backend
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
        }

        # WebSocket upgrade
        location /socket.io/ {
            limit_req zone=ws burst=10 nodelay;
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_read_timeout 86400;
        }

        # Frontend Next.js
        location / {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
        }
    }
}
